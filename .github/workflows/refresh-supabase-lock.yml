name: Validate Supabase foundation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-supabase-foundation:
    if: github.head_ref == 'agent/supabase-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/supabase-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: supabase-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
